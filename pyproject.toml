[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "football-analysis-v2"
version = "2.4.0"
description = "Resumable multi-source historical and live football data warehouse"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12",
  "duckdb>=1.4",
  "httpx>=0.27",
  "pandas>=2.2",
  "playwright>=1.50",
  "pytz>=2024.1",
  "pyarrow>=18",
  "python-dotenv>=1.0",
  "requests>=2.32",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "tenacity>=9.0",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
football-analysis = "football_analysis.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
